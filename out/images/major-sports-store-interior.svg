<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#0f172a"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Store shelves representation -->
  <g fill="none" stroke="#10b981" stroke-width="1" opacity="0.15">
    <rect x="80" y="120" width="200" height="500" rx="4"/>
    <rect x="320" y="120" width="200" height="500" rx="4"/>
    <rect x="560" y="120" width="200" height="500" rx="4"/>
    <rect x="800" y="120" width="200" height="500" rx="4"/>
    <rect x="1040" y="120" width="80" height="500" rx="4"/>
  </g>
  
  <!-- Badminton rackets on wall -->
  <g transform="translate(150, 200)" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3">
    <path d="M0,0 Q50,-80 100,0 Q50,40 0,0" />
    <path d="M20,0 Q70,-80 120,0 Q70,40 20,0" />
    <path d="M40,0 Q90,-80 140,0 Q90,40 40,0" />
    <path d="M60,0 Q110,-80 160,0 Q110,40 60,0" />
    <path d="M80,0 Q130,-80 180,0 Q130,40 80,0" />
  </g>
  
  <!-- Cricket bats -->
  <g transform="translate(400, 350)" fill="#8b4513" opacity="0.4">
    <rect x="0" y="0" width="15" height="120" rx="2"/>
    <ellipse cx="7.5" cy="-10" rx="35" ry="15"/>
  </g>
  <g transform="translate(450, 350)" fill="#8b4513" opacity="0.4">
    <rect x="0" y="0" width="15" height="120" rx="2"/>
    <ellipse cx="7.5" cy="-10" rx="35" ry="15"/>
  </g>
  
  <!-- Footballs -->
  <g transform="translate(700, 400)" fill="#white" opacity="0.2">
    <circle cx="0" cy="0" r="35" stroke="#3b82f6" stroke-width="2"/>
    <path d="M-35,0 Q0,-20 35,0" stroke="#3b82f6" stroke-width="2"/>
    <path d="M0,-35 Q20,0 0,35" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <g transform="translate(780, 400)" fill="#white" opacity="0.2">
    <circle cx="0" cy="0" r="35" stroke="#3b82f6" stroke-width="2"/>
    <path d="M-35,0 Q0,-20 35,0" stroke="#3b82f6" stroke-width="2"/>
    <path d="M0,-35 Q20,0 0,35" stroke="#3b82f6" stroke-width="2"/>
  </g>
  
  <!-- Dumbbells -->
  <g transform="translate(950, 500)" fill="#374151" opacity="0.5">
    <rect x="-40" y="-10" width="80" height="20" rx="10"/>
    <rect x="-55" y="-10" width="15" height="20" rx="3"/>
    <rect x="40" y="-10" width="15" height="20" rx="3"/>
  </g>
  
  <!-- Main text -->
  <text x="600" y="200" font-family="system-ui, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">🏪</text>
  <text x="600" y="280" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="#10b981" text-anchor="middle">MAJOR SPORTS</text>
  <text x="600" y="330" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Store Interior - Medchal</text>
  
  <!-- Category icons -->
  <g transform="translate(600, 400)" text-anchor="middle">
    <text x="-200" y="0" font-size="40">🏸</text>
    <text x="-100" y="0" font-size="40">🏏</text>
    <text x="0" y="0" font-size="40">⚽</text>
    <text x="100" y="0" font-size="40">💪</text>
    <text x="200" y="0" font-size="40">🎒</text>
  </g>
  
  <text x="600" y="500" font-family="system-ui, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">Badminton • Cricket • Football • Fitness • Accessories</text>
  
  <rect x="500" y="540" width="200" height="3" fill="#10b981" opacity="0.5"/>
  
  <text x="600" y="580" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">MAJOR SPORTS • Demo Store Interior</text>
  
  <!-- Address -->
  <text x="600" y="640" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle" opacity="0.7">Phase B, Plot No. 44 Part • Next to Sakshi Pharmacy</text>
  <text x="600" y="660" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle" opacity="0.7">Near Shivaji Statue, NJR KLR Nagar • Medchal, Secunderabad, Telangana – 501401</text>
</svg>
